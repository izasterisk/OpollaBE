name: Google Sheets Sync

on:
  schedule:
    # Chạy vào lúc 1:00 AM giờ Việt Nam (18:00 UTC) mỗi ngày
    - cron: '0 18 * * *'
  # Thêm nút bấm chạy thủ công trên giao diện GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Sync Student Data to Google Sheets
        run: |
          response=$(curl -X POST \
            'https://opollabe.onrender.com/api/GoogleSheetsSync' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            --max-time 90 \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Sync successful"
            echo "$body"
            exit 0
          else
            echo "❌ Sync failed with status code: $http_code"
            echo "$body"
            exit 1
          fi

      - name: Retry on Failure
        if: failure()
        run: |
          echo "🔄 Retrying..."
          sleep 10
          
          response=$(curl -X POST \
            'https://opollabe.onrender.com/api/GoogleSheetsSync' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            --max-time 90 \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Retry successful"
            echo "$body"
            exit 0
          else
            echo "❌ Retry failed with status code: $http_code"
            echo "$body"
            exit 1
          fi